[build-system]
requires = ["setuptools>=69", "setuptools_scm[toml]>=8", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "moosaspy"
dynamic = ["version"]
description = "MOOSAS core Python package for geometry transformation and building performance analysis."
readme = "MoosasPy/README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Jun Xiao" },
  { anme = "Yihui Li" },
  { name = "Hongzhong Chen" }
]
keywords = ["building", "simulation", "geometry", "energy", "moosas"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26,<2.0",
  "scipy>=1.14,<2.0",
  "networkx>=3.4,<4.0",
  "shapely>=2.0,<3.0",
  "rdflib>=7.1,<8.0",
  "eppy>=0.5.63,<0.6",
  "ifcopenshell>=0.8,<0.9",
  "lxml>=5.4,<6.0",
  "scikit-learn>=1.5,<2.0",
  "xgboost>=2.1,<3.0",
  "requests>=2.31,<3.0",
  "matplotlib>=3.8,<4.0",
  "tinynumpy>=1.2,<2.0",
]

[project.urls]
Homepage = "https://github.com/KLEGB/moosas"
Repository = "https://github.com/KLEGB/moosas"
Issues = "https://github.com/KLEGB/moosas/issues"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["MoosasPy", "MoosasPy.*"]

[tool.setuptools.package-data]
MoosasPy = [
  "data/**/*",
  "db/**/*",
  "libs/**/*",
  "utils/_.pth",
]

[tool.setuptools.exclude-package-data]
"*" = [
  "__pycache__/*",
  "*.py[cod]",
  ".idea/*",
  "**/.idea/*",
  "__temp__/*",
  "__temp__/**/*",
]

[tool.setuptools_scm]
tag_regex = "^moosaspy-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"
write_to = "MoosasPy/_version.py"
write_to_template = "__version__ = \"{version}\"\n"
