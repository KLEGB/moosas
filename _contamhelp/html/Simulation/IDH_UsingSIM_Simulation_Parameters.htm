        <h3><a name="kanchor142"></a>Simulation Parameters</h3>
        <p>Simulation parameters are those used to control the type of simulation that you wish ContamX to perform and the type of results output you wish ContamX to provide. This section provides detailed descriptions of the specific simulation parameters.</p>
