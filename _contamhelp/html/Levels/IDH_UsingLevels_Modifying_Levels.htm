        <h3><a name="kanchor18"></a>Modifying Levels</h3>
        <p>To modify level data, you access the Level Data dialog box using the <span style="font-weight: bold;text-decoration: underline;">E</span><span style="font-weight: bold;">dit Level Data…</span> command of the <span style="font-weight: bold;text-decoration: underline;">L</span><span style="font-weight: bold;">evel</span> menu. You can also use the keyboard shortcut <span style="font-weight: bold;">F8</span> to display the dialog box. The following section shows the information contained on the "Level Data" dialog box.</p>
