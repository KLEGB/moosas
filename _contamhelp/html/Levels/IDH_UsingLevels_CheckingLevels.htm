        <h3><a name="kanchor20"></a>Checking Levels</h3>
        <p>Menu Command:&#160;<span style="font-weight: bold;text-decoration: underline;">L</span><span style="font-weight: bold;">evel </span>&#8594;<span style="font-weight: bold;"> Check C</span><span style="font-weight: bold;text-decoration: underline;">u</span><span style="font-weight: bold;">rrent Level</span><br />Keyboard Shortcut: &#160;None<br />Toolbar Button: &#160;None </p>
        <p>Use this feature to check the data for the currently displayed level and make sure the building components are defined. Errors will be highlighted in red on the SketchPad.</p>
