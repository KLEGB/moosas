        <p class="code">Message Header;</p>
        <p class="code"><span style="color: blue;">int </span>date0;       <span style="color: #008100;">// simulation start date</span></p>
        <p class="code"><span style="color: blue;">int </span>date1;       <span style="color: #008100;">// simulation end date</span></p>
        <p class="code"><span style="color: blue;">int </span>time0;       <span style="color: #008100;">// simulation start time</span></p>
        <p class="code"><span style="color: blue;">int </span>time1;       <span style="color: #008100;">// simulation end time</span></p>
        <p class="code"><span style="color: blue;">int </span>timestep;       <span style="color: #008100;">// simulation time step [s]</span></p>
