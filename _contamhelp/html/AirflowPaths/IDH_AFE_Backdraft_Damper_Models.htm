        <h5><a name="kanchor58"></a>Backdraft Damper Models</h5>
        <p>The Backdraft Damper models make it possible to model a feature that has different flow resistances depending on the direction of the pressure drop, with greatly reduced (or zero) flow in one direction. Note that there are similar models available for duct flow elements.</p>
