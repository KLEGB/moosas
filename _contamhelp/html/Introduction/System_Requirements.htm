        <h2>System Requirements</h2>
        <p>The CONTAM interface (ContamW) runs under Windows 7, 8 and 10. However, the CONTAM simulation engine (ContamX) can run under both Windows and Linux environments, and both versions are provided on the CONTAM download website (See <a href="../GetStarted/IDH_GetStart_InstallingContamW.htm">Installing CONTAM</a>).</p>
