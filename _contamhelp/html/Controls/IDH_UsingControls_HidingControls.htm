        <h3>Hiding Controls</h3>
        <p>If there are controls in your project, you can hide them on the SketchPad. Use the <span style="font-weight: bold;text-decoration: underline;">V</span><span style="font-weight: bold;">iew </span><span style="font-family: Symbol;">®</span><span style="font-weight: bold;"></span><span style="font-weight: bold;text-decoration: underline;">C</span><span style="font-weight: bold;">ontrol Links</span> menu command to toggle the display of the control network on and off.
        </p>
