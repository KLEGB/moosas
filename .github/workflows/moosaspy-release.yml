name: Release MoosasPy

on:
  push:
    tags:
      - "moosaspy-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set release version
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#moosaspy-v}"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${release_version}" >> "$GITHUB_ENV"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Verify native executable permissions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          executables = (
              "MoosasPy/libs/rad/MoosasRad",
              "MoosasPy/libs/rad/gensky",
              "MoosasPy/libs/rad/oconv",
              "MoosasPy/libs/rad/rcalc",
              "MoosasPy/libs/rad/rtrace",
              "MoosasPy/libs/vent/MoosasAFN",
              "MoosasPy/libs/vent/contam/linux-x86_64/contamx3",
              "MoosasPy/libs/vent/contam/linux-x86_64/simread",
              "MoosasPy/libs/weather/epw2wea",
              "MoosasPy/libs/weather/gendaymtx",
          )
          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              missing_permissions = [
                  name for name in executables
                  if archive.getinfo(name).external_attr >> 16 & 0o111 == 0
              ]
          if missing_permissions:
              raise SystemExit(
                  "Wheel contains non-executable native binaries: "
                  + ", ".join(missing_permissions)
              )
          PY

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
