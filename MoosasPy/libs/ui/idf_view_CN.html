<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOOSAS 数据可视化</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <style>
    /* 基础字体设置 */
    * {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #404040;
    }

    /* 标题样式 */
    h1 {
      font-size: 24px;
      font-weight: bold;
      color: #404040;
    }

    h2 {
      font-size: 18px;
      font-weight: bold;
      color: #404040;
    }

    /* 建筑基本信息专用样式 - 增大字号并加粗 */
    #building-info {
      font-size: 16px; /* 比上一版再大1px */
      font-weight: 600; /* 加粗（中等粗细） */
      line-height: 1.7; /* 进一步增加行高，适配加粗后的文字密度 */
      color: #333333; /* 略微加深颜色，配合加粗增强可读性 */
    }

    /* 容器和卡片样式 */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 7px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    /* 网格布局 */
    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-height: 700px;
    }

    .subgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      height: 100%;
    }

    /* 图表容器 */
    .chart-container {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .typical-chart-container {
      min-height: 220px;
      max-height: 280px;
    }

    .monthly-chart-container {
      min-height: 450px;
      max-height: 550px;
    }

    .pie-container {
      height: 280px;
      max-width: 500px;
      margin: 0 auto;
    }

    .bottom-card {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .bottom-card .chart-container {
      flex: 1;
    }

    /* 响应式调整 */
    @media (max-width: 992px) {
      .grid, .bottom-grid { grid-template-columns: 1fr; }
      .bottom-grid { max-height: none; }
    }

    @media (max-width: 640px) {
      .subgrid { grid-template-columns: 1fr; }
      .typical-chart-container, .monthly-chart-container { min-height: 200px; }
      #building-info {
        font-size: 15px; /* 小屏幕略减 */
        font-weight: 500; /* 小屏幕略微减轻加粗程度 */
      }
    }
  </style>
</head>
<body style="background-color: #f5f5f5;">
<div class="container">
  <h1 class="mb-4">建筑能耗数据分析</h1>

  <!-- 顶部区域 -->
  <div class="grid">
    <div class="card">
      <h2 class="mb-2"><i class="fa fa-building-o mr-2"></i>建筑基本信息</h2>
      <div id="building-info" class="whitespace-pre-line">{{info_txt}}</div>
    </div>
    <div class="card">
      <h2 class="mb-2"><i class="fa fa-pie-chart mr-2"></i>全年能耗分布 (kWh/m²)</h2>
      <div class="chart-container pie-container">
        <canvas id="yearly-pie"></canvas>
      </div>
    </div>
  </div>

  <!-- 逐时数据 -->
  <div class="card">
    <h2 class="mb-2"><i class="fa fa-line-chart mr-2"></i>逐时能耗数据 (W/m²)</h2>
    <div class="chart-container" style="min-height: 300px; max-height: 400px;">
      <canvas id="hourly-chart"></canvas>
    </div>
  </div>

  <!-- 底部区域 -->
  <div class="bottom-grid">
    <!-- 典型月数据 -->
    <div class="card bottom-card">
      <h2 class="mb-2"><i class="fa fa-calendar mr-2"></i>典型月能耗 (W/m²)</h2>
      <div class="subgrid">
        <div class="chart-container typical-chart-container"><canvas id="typical-1"></canvas></div>
        <div class="chart-container typical-chart-container"><canvas id="typical-4"></canvas></div>
        <div class="chart-container typical-chart-container"><canvas id="typical-7"></canvas></div>
        <div class="chart-container typical-chart-container"><canvas id="typical-11"></canvas></div>
      </div>
    </div>

    <!-- 逐月数据 -->
    <div class="card bottom-card">
      <h2 class="mb-2"><i class="fa fa-bar-chart mr-2"></i>逐月能耗数据 (W/m²)</h2>
      <div class="chart-container monthly-chart-container">
        <canvas id="monthly-chart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
  const appData = {{app_data_json}};

  document.addEventListener('DOMContentLoaded', function() {
    const charts = {
      yearlyPie: createPieChart(),
      hourly: createHourlyChart(),
      monthly: createMonthlyChart(),
      ...createTypicalCharts()
    };

    window.addEventListener('resize', () => {
      Object.values(charts).forEach(chart => chart.resize());
    });
  });

  // 1. 全年饼图
  function createPieChart() {
    const ctx = document.getElementById('yearly-pie').getContext('2d');
    return new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['制冷能耗', '采暖能耗', '照明能耗'],
        datasets: [{
          data: [appData.totals.cooling, appData.totals.heating, appData.totals.lighting],
          backgroundColor: ['#049cdb', '#c43c35', '#fceec1'],
          borderWidth: 0,
          hoverOffset: 5
        }]
      },
      options: {
        cutout: '65%',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'right',
            labels: {
              boxWidth: 12,
              padding: 15,
              color: '#404040'
            }
          },
          tooltip: {
            callbacks: {
              label: (ctx) => `${ctx.label}: ${ctx.raw.toFixed(2)} kWh/m²`
            }
          }
        },
        layout: { padding: 10 }
      }
    });
  }

  // 2. 逐时数据图表
  function createHourlyChart() {
    const ctx = document.getElementById('hourly-chart').getContext('2d');
    const labels = appData.hourly.map(row => row.datetime);
    const cooling = appData.hourly.map(row => parseFloat(row['sensible cooling']) || 0);
    const heating = appData.hourly.map(row => parseFloat(row['sensible heating']) || 0);

    return new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: '制冷能耗',
            data: cooling,
            borderColor: '#0064cd',
            borderWidth: 1.2,
            fill: false,
            tension: 0.2,
            pointRadius: 0,
            pointHoverRadius: 4,
            pointHoverBackgroundColor: '#0064cd'
          },
          {
            label: '采暖能耗',
            data: heating,
            borderColor: '#c43c35',
            borderWidth: 1.2,
            fill: false,
            tension: 0.2,
            pointRadius: 0,
            pointHoverRadius: 4,
            pointHoverBackgroundColor: '#c43c35'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false, axis: 'x' },
        scales: {
          x: {
            title: { display: true, text: '时间', color: '#404040' },
            ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 12, color: '#404040' }
          },
          y: {
            title: { display: true, text: '能耗 (W/m²)', color: '#404040' },
            beginAtZero: true,
            ticks: { color: '#404040' }
          }
        },
        plugins: {
          legend: {
            position: 'top',
            labels: {
              usePointStyle: true,
              boxWidth: 6,
              color: '#404040'
            }
          }
        }
      }
    });
  }

  // 3. 逐月数据图表
  function createMonthlyChart() {
    const ctx = document.getElementById('monthly-chart').getContext('2d');
    const labels = appData.monthly.map(row => `${row.month}月`);
    const cooling = appData.monthly.map(row => parseFloat(row['sensible cooling']) || 0);
    const heating = appData.monthly.map(row => parseFloat(row['sensible heating']) || 0);

    return new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: '制冷能耗', data: cooling, backgroundColor: '#0064cd' },
          { label: '采暖能耗', data: heating, backgroundColor: '#c43c35' }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            stacked: true,
            ticks: { font: { size: 11 }, color: '#404040' }
          },
          y: {
            stacked: true,
            title: { display: true, text: '能耗 (W/m²)', font: { size: 12 }, color: '#404040' },
            beginAtZero: true,
            ticks: {
              maxTicksLimit: 10,
              font: { size: 11 },
              color: '#404040'
            },
            grid: { drawBorder: false }
          }
        },
        plugins: {
          legend: {
            position: 'top',
            labels: {
              usePointStyle: true,
              font: { size: 11 },
              color: '#404040'
            }
          }
        },
        layout: {
          padding: { top: 10, bottom: 20 }
        }
      }
    });
  }

  // 4. 典型日图表
  function createTypicalCharts() {
    const months = [1,4,7,11];
    const monthNames = {1: '1月', 4: '4月', 7: '7月', 11: '11月'};
    const charts = {};

    months.forEach(month => {
      const ctx = document.getElementById(`typical-${month}`).getContext('2d');
      const data = appData.typical[month.toString()];
      const labels = data.map(row => `${row.hour}:00`);
      const cooling = data.map(row => parseFloat(row['sensible cooling']) || 0);
      const heating = data.map(row => parseFloat(row['sensible heating']) || 0);

      charts[`typical-${month}`] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '制冷',
              data: cooling,
              borderColor: '#0064cd',
              borderWidth: 2,
              fill: false,
              pointRadius: 3,
              pointHoverRadius: 5,
              pointBackgroundColor: '#0064cd',
              pointBorderColor: '#fff',
              pointBorderWidth: 1
            },
            {
              label: '采暖',
              data: heating,
              borderColor: '#c43c35',
              borderWidth: 2,
              fill: false,
              pointRadius: 3,
              pointHoverRadius: 5,
              pointBackgroundColor: '#c43c35',
              pointBorderColor: '#fff',
              pointBorderWidth: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          title: {
            display: true,
            text: monthNames[month],
            font: { size: 13, weight: 'bold' },
            color: '#404040'
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { maxTicksLimit: 6, font: { size: 10 }, color: '#404040' },
              grid: { drawBorder: false }
            },
            x: {
              ticks: { maxTicksLimit: 6, font: { size: 10 }, color: '#404040' },
              grid: { display: false }
            }
          },
          plugins: {
            legend: {
              display: true,
              labels: {
                font: { size: 10 },
                boxWidth: 8,
                padding: 10,
                color: '#404040'
              }
            }
          }
        }
      });
    });
    return charts;
  }
</script>
</body>
</html>
